<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Group Progress</title>
		<meta
			name="description"
			content="Sessions, hours and rhythm of a time-bounded group — computed live, shared as a link."
		/>
		<meta property="og:title" content="Group Progress" />
		<meta
			property="og:description"
			content="Sessions, hours and rhythm of a time-bounded group — computed live, shared as a link."
		/>
		<meta property="og:type" content="website" />
		<meta
			property="og:image"
			content="https://ksipunin.github.io/psycho-group-progress/assets/og.png"
		/>
		<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="style.css" />
		<script type="module" src="src/app.js"></script>
	</head>
	<body>
		<main id="app">
			<noscript>This tool needs JavaScript to compute progress from the link.</noscript>
		</main>

		<template id="tpl-lang-toggle">
			<div class="lang-toggle" role="group" aria-label="Language / Язык">
				<button type="button" class="lang" data-lang="en">EN</button>
				<button type="button" class="lang" data-lang="ru">RU</button>
			</div>
		</template>

		<template id="tpl-page">
			<article class="page">
				<header class="masthead">
					<div class="title-slot"></div>
					<p class="subline"></p>
					<p class="note note-badlink" data-i18n="badLink" hidden></p>
				</header>
				<section class="block sec-progress">
					<h2 class="label" data-i18n="progress"></h2>
					<p class="hero"><span class="hero-value"></span><span class="hero-side"></span></p>
					<div class="meter">
						<div class="meter-done"></div>
						<div class="meter-upcoming"></div>
						<div class="meter-now"></div>
					</div>
				</section>
				<section class="block sec-next">
					<div class="next-card">
						<h2 class="label accent" data-i18n="nextSession"></h2>
						<p class="next-when"></p>
					</div>
				</section>
				<section class="block sec-rhythm">
					<h2 class="label" data-i18n="rhythm"></h2>
					<div class="strip"></div>
					<div class="axis"></div>
					<p class="rhythm-caption" data-i18n="hoursPerWeek"></p>
					<div class="legend">
						<span class="key"><i class="swatch done"></i><span data-i18n="done"></span></span>
						<span class="key"
							><i class="swatch upcoming"></i><span data-i18n="upcoming"></span
						></span>
					</div>
				</section>
				<section class="block sec-schedule">
					<h2 class="label" data-i18n="schedule"></h2>
					<div class="schedule-slot"></div>
				</section>
				<footer class="page-actions">
					<p class="note note-copyerror" role="status" hidden></p>
				</footer>
			</article>
		</template>

		<template id="tpl-session">
			<li class="session">
				<i class="dot"></i>
				<span class="date"></span>
				<span class="time"></span>
				<span class="hours"></span>
			</li>
		</template>

		<template id="tpl-bar"
			><div class="slot"><div class="bar"></div></div
		></template>
		<template id="tpl-seg"><div class="seg"></div></template>
		<template id="tpl-axis-cell"><span class="axis-cell"></span></template>

		<template id="tpl-form-row">
			<div class="row">
				<input type="date" name="date" min="2000-01-01" max="2099-12-31" data-i18n-aria="date" />
				<input type="time" name="start" data-i18n-aria="start" />
				<input type="time" name="end" data-i18n-aria="end" />
				<button type="button" class="remove" data-i18n-aria="remove">×</button>
			</div>
		</template>
	</body>
</html>
