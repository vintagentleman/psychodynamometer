<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<script>
			try {
				const theme = localStorage.getItem('theme');
				if (theme === 'light' || theme === 'dark') {
					document.documentElement.classList.add('theme-' + theme);
					document.querySelector('meta[name="color-scheme"]').setAttribute('content', theme);
				}
			} catch {
				/* storage blocked — fall back to the system scheme */
			}
		</script>
		<title>Psychodynamometer</title>
		<meta
			name="description"
			content="Sessions, hours and rhythm of a time-bounded group — computed live, shared as a link."
		/>
		<meta property="og:title" content="Psychodynamometer" />
		<meta
			property="og:description"
			content="Sessions, hours and rhythm of a time-bounded group — computed live, shared as a link."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://vintagentleman.github.io/psychodynamometer/" />
		<meta
			property="og:image"
			content="https://vintagentleman.github.io/psychodynamometer/assets/og.png"
		/>
		<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
		<script type="module" src="/src/app.ts"></script>
	</head>
	<body>
		<main id="app">
			<noscript>This tool needs JavaScript to compute progress from the link.</noscript>
		</main>

		<template id="tpl-topbar">
			<header class="topbar">
				<div class="app-id">
					<h1 class="app-title" data-i18n="appTitle"></h1>
					<p class="app-tagline" data-i18n="tagline"></p>
				</div>
				<div class="topbar-actions">
					<div class="lang-toggle" role="group" aria-label="Language / Язык">
						<button type="button" class="lang" data-lang="en">EN</button>
						<button type="button" class="lang" data-lang="ru">RU</button>
					</div>
					<div class="theme-toggle" role="group" data-i18n-aria="theme">
						<button
							type="button"
							class="theme"
							data-theme-choice="system"
							data-i18n-aria="themeSystem"
						>
							<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
								<circle
									cx="8"
									cy="8"
									r="6.4"
									fill="none"
									stroke="currentColor"
									stroke-width="1.3"
								/>
								<path fill="currentColor" d="M8 1.6a6.4 6.4 0 000 12.8z" />
							</svg>
						</button>
						<button type="button" class="theme theme-pin" data-theme-choice="pin">
							<svg
								class="i-sun"
								viewBox="0 0 16 16"
								width="16"
								height="16"
								aria-hidden="true"
								focusable="false"
							>
								<circle cx="8" cy="8" r="3.2" fill="currentColor" />
								<g stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
									<line x1="8" y1="1" x2="8" y2="2.6" />
									<line x1="8" y1="13.4" x2="8" y2="15" />
									<line x1="1" y1="8" x2="2.6" y2="8" />
									<line x1="13.4" y1="8" x2="15" y2="8" />
									<line x1="3.1" y1="3.1" x2="4.2" y2="4.2" />
									<line x1="11.8" y1="11.8" x2="12.9" y2="12.9" />
									<line x1="3.1" y1="12.9" x2="4.2" y2="11.8" />
									<line x1="11.8" y1="4.2" x2="12.9" y2="3.1" />
								</g>
							</svg>
							<svg
								class="i-moon"
								viewBox="0 0 16 16"
								width="16"
								height="16"
								aria-hidden="true"
								focusable="false"
							>
								<path fill="currentColor" d="M6.2 2.3a6 6 0 107.5 7.5A5 5 0 016.2 2.3z" />
							</svg>
						</button>
					</div>
					<a
						class="gh-link"
						href="https://github.com/vintagentleman/psychodynamometer"
						target="_blank"
						rel="noopener"
						aria-label="GitHub"
					>
						<svg
							viewBox="0 0 16 16"
							width="20"
							height="20"
							fill="currentColor"
							aria-hidden="true"
							focusable="false"
						>
							<path
								d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
							/>
						</svg>
					</a>
				</div>
			</header>
		</template>

		<template id="tpl-page">
			<article class="page">
				<header class="masthead">
					<div class="title-slot"></div>
					<p class="subline"></p>
					<p class="note note-badlink" data-i18n="badLink" hidden></p>
				</header>
				<section class="block sec-progress">
					<h2 class="label" data-i18n="progress"></h2>
					<p class="hero"><span class="hero-value"></span><span class="hero-side"></span></p>
					<div class="meter">
						<div class="meter-done"></div>
						<div class="meter-upcoming"></div>
						<div class="meter-now"></div>
					</div>
				</section>
				<section class="block sec-next">
					<div class="next-card">
						<h2 class="label accent" data-i18n="nextSession"></h2>
						<p class="next-when"></p>
						<p class="next-local" hidden></p>
					</div>
				</section>
				<section class="block sec-rhythm">
					<h2 class="label" data-i18n="rhythm"></h2>
					<div class="strip"></div>
					<div class="axis"></div>
					<p class="rhythm-caption" data-i18n="hoursPerWeek"></p>
					<div class="legend">
						<span class="key"><i class="swatch done"></i><span data-i18n="done"></span></span>
						<span class="key"
							><i class="swatch upcoming"></i><span data-i18n="upcoming"></span
						></span>
					</div>
				</section>
				<section class="block sec-schedule">
					<h2 class="label" data-i18n="schedule"></h2>
					<div class="schedule-slot"></div>
				</section>
				<footer class="page-actions">
					<p class="note note-copyerror" role="status" hidden></p>
				</footer>
			</article>
		</template>

		<template id="tpl-session">
			<li class="session">
				<i class="dot"></i>
				<div class="session-body">
					<div class="session-main">
						<span class="date"></span>
						<span class="time"></span>
						<span class="hours"></span>
					</div>
					<div class="local-time"></div>
				</div>
			</li>
		</template>

		<template id="tpl-bar"
			><div class="slot"><div class="bar"></div></div
		></template>
		<template id="tpl-seg"><div class="seg"></div></template>
		<template id="tpl-axis-cell"><span class="axis-cell"></span></template>

		<template id="tpl-form-row">
			<div class="row">
				<input type="date" name="date" min="2000-01-01" max="2099-12-31" data-i18n-aria="date" />
				<input type="time" name="start" data-i18n-aria="start" />
				<input type="time" name="end" data-i18n-aria="end" />
				<button type="button" class="remove" data-i18n-aria="remove">×</button>
			</div>
		</template>
	</body>
</html>
